<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quarter Progress</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; display: flex; align-items: flex-start; justify-content: center; padding: 16px; font-family: 'Inter', sans-serif; }

  .qp-wrap { padding: 28px; background: #fff; border-radius: 16px; border: 1px solid #e8e8e8; width: 100%; max-width: 480px; }

  .qp-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #999; margin-bottom: 4px; }
  .qp-title { font-size: 16px; font-weight: 600; color: #111; margin: 0 0 24px; }

  .qp-hero { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 24px; }
  .qp-pct-num { font-size: 64px; font-weight: 700; letter-spacing: -2px; color: #111; line-height: 1; }
  .qp-pct-sym { font-size: 32px; font-weight: 400; color: #bbb; letter-spacing: -1px; }
  .qp-hero-sub { display: flex; flex-direction: column; gap: 5px; padding-bottom: 8px; }
  .qp-hero-line { font-size: 13px; color: #888; }
  .qp-hero-line strong { color: #333; font-weight: 500; }

  .qp-bar-track { width: 100%; height: 10px; background: #f0f0f0; border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .qp-bar-fill { height: 100%; border-radius: 99px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }
  .qp-bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: #bbb; margin-bottom: 20px; }

  .qp-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: #ebebeb; border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
  .qp-stat { background: #fafafa; padding: 12px 14px; }
  .qp-stat-label { font-size: 10px; font-weight: 600; color: #aaa; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
  .qp-stat-val { font-size: 20px; font-weight: 700; color: #111; letter-spacing: -0.5px; }

  .qp-footer { display: flex; align-items: center; justify-content: space-between; }
  .qp-today { font-size: 12px; color: #aaa; }
  .qp-today strong { color: #555; font-weight: 500; }
  .qp-badge { font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 20px; }
  .badge-early { background: #eef7f2; color: #2e7d52; }
  .badge-mid   { background: #fff8e6; color: #a06b00; }
  .badge-late  { background: #fdecea; color: #b83535; }
</style>
</head>
<body>
<div class="qp-wrap" id="card"></div>
<script>
function go() {
  const now = new Date();
  const m = now.getMonth();
  const y = now.getFullYear();
  const qi = Math.floor(m / 3);
  const qNum = qi + 1;
  const qStart = new Date(y, qi * 3, 1);
  const qEnd = new Date(y, qi * 3 + 3, 1);
  const totalMs = qEnd - qStart;
  const elapsedMs = now - qStart;
  const pct = Math.min(100, Math.max(0, (elapsedMs / totalMs) * 100));
  const totalDays = Math.round(totalMs / 86400000);
  const elapsedDays = Math.round(elapsedMs / 86400000);
  const daysLeft = totalDays - elapsedDays;
  const pctR = Math.round(pct);

  const barColor = pct >= 85 ? '#e05252' : pct >= 60 ? '#e8a020' : '#2563eb';
  const badgeClass = pct >= 66 ? 'badge-late' : pct >= 33 ? 'badge-mid' : 'badge-early';
  const badgeText = pct >= 66 ? 'Final stretch' : pct >= 33 ? 'Mid-quarter' : 'Early quarter';

  const fd = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const todayStr = now.toLocaleDateString('en-US', { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' });

  document.getElementById('card').innerHTML = `
    <div class="qp-eyebrow">Q${qNum} ${y}</div>
    <p class="qp-title">Quarter progress</p>
    <div class="qp-hero">
      <div>
        <span class="qp-pct-num">${pctR}</span><span class="qp-pct-sym">%</span>
      </div>
      <div class="qp-hero-sub">
        <div class="qp-hero-line">Day <strong>${elapsedDays}</strong> of <strong>${totalDays}</strong></div>
        <div class="qp-hero-line"><strong>${daysLeft}</strong> days remaining</div>
      </div>
    </div>
    <div class="qp-bar-track">
      <div class="qp-bar-fill" style="width:${pctR}%; background:${barColor};"></div>
    </div>
    <div class="qp-bar-labels">
      <span>${fd(qStart)}</span>
      <span>${fd(new Date(qEnd - 86400000))}</span>
    </div>
    <div class="qp-stats">
      <div class="qp-stat">
        <div class="qp-stat-label">Elapsed</div>
        <div class="qp-stat-val">${elapsedDays}d</div>
      </div>
      <div class="qp-stat">
        <div class="qp-stat-label">Remaining</div>
        <div class="qp-stat-val">${daysLeft}d</div>
      </div>
      <div class="qp-stat">
        <div class="qp-stat-label">Total</div>
        <div class="qp-stat-val">${totalDays}d</div>
      </div>
    </div>
    <div class="qp-footer">
      <div class="qp-today">Today &nbsp;<strong>${todayStr}</strong></div>
      <div class="qp-badge ${badgeClass}">${badgeText}</div>
    </div>
  `;
}
go();
</script>
</body>
</html>
